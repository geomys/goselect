name: Go tests
on:
  push:
  pull_request:
  schedule: # daily at 09:42 UTC
    - cron: '42 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go:
          - { go-version-file: go.mod }
          - { go-version: stable }
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go.go-version }}
          go-version-file: ${{ matrix.go.go-version-file }}
      - run: go test -race ./...
      # Download a real toolchain from proxy.golang.org, once per OS.
      - if: matrix.go.go-version == 'stable'
        run: go test -run TestNetwork ./cmd/go -args -network
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Only the packages that goup doesn't fork from upstream.
      - uses: geomys/sandboxed-step@v1.2.2
        with:
          run: |
            go run honnef.co/go/tools/cmd/staticcheck@latest \
              ./cmd/... ./internal/upstream/... ./internal/std/godebug \
              ./internal/std/syscall/... ./internal/std/testenv \
              ./internal/cmd/telemetry/... ./internal/go/trace
